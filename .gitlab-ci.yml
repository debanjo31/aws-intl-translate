default:
  image: node:22-alpine

stages:
  - test
  - deploy

validate:
  stage: test
  script:
    - npm --prefix frontend run check

deploy-pages:
  stage: deploy
  script:
    - mkdir public
    - cp frontend/index.html frontend/styles.css frontend/app.js public/
    - cp -r frontend/data public/data
  pages: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment:
    name: production
    url: $CI_PAGES_URL
